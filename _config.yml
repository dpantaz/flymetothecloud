# --- Permalinks (WordPress "Day and name") -----------------------------------
permalink: /:year/:month/:day/:title/

# --- Build settings ----------------------------------------------------------
markdown: kramdown
highlighter: rouge
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# --- Defaults ----------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - README.md
  - node_modules
  - package.json
  - package-lock.json
