# --- Site settings -----------------------------------------------------------
title: Flymetothecloud.com
tagline: "Cloud | IT Ops | Automation"
email: ""
description: >-
  Cloud, Azure, and infrastructure notes by Dimitris Pantazis.
url: "https://flymetothecloud.com"   # the custom domain (no trailing slash)
baseurl: ""                           # empty for an apex/custom domain
logo: /assets/img/logo-white.png
logo_dark: /wp-content/uploads/2020/07/Drawing1.png

# --- Author / Welcome widget -------------------------------------------------
author:
  name: Dimitris Pantazis
  role: Cloud Solution Architect
  photo: /assets/img/author.png
  bio: |
    Specializing in Azure Landing Zones, Terraform, Governance, Security, and Automation.

    Sharing real-world guidance, implementation patterns, and lessons learned for building secure, scalable, and well-governed Azure environments.
  location: Athens, Greece
  social:
    linkedin: https://www.linkedin.com/in/dpantaz/
    github: https://github.com/dpantaz

# --- Navigation --------------------------------------------------------------
nav:
  - title: About
    url: /about/
  - title: Presentations
    url: /presentations/

# --- Badges widget (certifications) ------------------------------------------
badges:
  - { img: /wp-content/uploads/2020/10/azure-solutions-architect-expert-600x600.png, alt: "Azure Solutions Architect Expert" }
  - { img: /assets/img/devops-engineer-expert.png, alt: "DevOps Engineer Expert" }
  - { img: /assets/img/mct-certified-trainer-2026.png, alt: "Microsoft Certified Trainer 2026" }
  - { img: /assets/img/mvp-2024.png, alt: "Microsoft MVP 2024" }

# --- Permalinks (WordPress "Day and name") -----------------------------------
permalink: /:year/:month/:day/:title/

# --- Build settings ----------------------------------------------------------
markdown: kramdown
highlighter: rouge
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# --- Defaults ----------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - README.md
  - node_modules
  - package.json
  - package-lock.json
