<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.logo_dark %}<link rel="icon" href="{{ site.logo_dark | relative_url }}">{% elsif site.logo %}<link rel="icon" href="{{ site.logo | relative_url }}">{% endif %}
  {% feed_meta %}
  {% seo %}
</head>
<body>
  {% include header.html %}

  <div class="page-wrap">
    <div class="container">
      <main class="content">
        {{ content }}
      </main>
      {% include sidebar.html %}
    </div>
  </div>

  <footer class="site-footer">
    <p>Copyright &copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
  </footer>
  <script>
    (function () {
      var header = document.querySelector('.site-header');
      if (!header) return;
      var onScroll = function () {
        header.classList.toggle('scrolled', window.scrollY > 40);
      };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
  <script>
    (function () {
      document.querySelectorAll('.yt-embed').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          var id = el.getAttribute('data-id');
          if (!id) return;
          var iframe = document.createElement('iframe');
          iframe.setAttribute('src', 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0');
          iframe.setAttribute('title', 'YouTube video player');
          iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
          iframe.setAttribute('allowfullscreen', '');
          el.innerHTML = '';
          el.appendChild(iframe);
        });
      });
    })();
  </script>
</body>
</html>
